# probe bisect — temporary
name: Probe C
on:
  push:
    branches: ["arena/**"]
permissions:
  contents: read
jobs:
  julia:
    name: julia only
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: julia-actions/setup-julia@v3.0.2
        with:
          version: "1"
      - name: version
        run: julia --version

