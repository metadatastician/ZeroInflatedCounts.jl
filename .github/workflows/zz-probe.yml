# TEMPORARY probe workflow — used while building the implementation.
# It exists to measure what the GitHub-hosted runner can actually do
# (Agda/R/Julia toolchains, pscl conventions). Deleted before the PR lands.
name: Probe
on:
  push:
    branches: ["arena/**"]

permissions:
  contents: read

jobs:
  agda:
    name: agda probe
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install agda
        run: |
          sudo apt-get update -qq
          apt-cache policy agda agda-stdlib agda-bin | sed -n '1,40p'
          sudo apt-get install -y -qq agda agda-stdlib || sudo apt-get install -y -qq agda-bin agda-stdlib
          agda --version
          dpkg -L agda-stdlib | grep -E '\.agda-lib$|Data/Nat/Base\.agda$' | head -5
      - name: Configure library
        run: |
          set -euo pipefail
          LIB="$(dpkg -L agda-stdlib | grep -E '/standard-library\.agda-lib$' | head -1 || true)"
          if [ -z "${LIB:-}" ]; then
            SRC="$(dpkg -L agda-stdlib | grep -E '/Data/Nat/Base\.agda$' | head -1)"
            ROOT="${SRC%/Data/Nat/Base.agda}"
            LIB="$ROOT/standard-library.agda-lib"
            printf 'name: standard-library\ninclude: .\n' | sudo tee "$LIB" >/dev/null
          fi
          sudo chmod -R a+rwX "$(dirname "$LIB")"
          mkdir -p "$HOME/.agda"
          echo "$LIB" > "$HOME/.agda/libraries"
          echo "standard-library" > "$HOME/.agda/defaults"
          echo "library: $LIB"
      - name: Typecheck the template proof
        run: |
          cd verification/proofs/agda
          agda --safe --without-K Properties.agda
          echo "AGDA-OK"

  r:
    name: R pscl probe
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install R + pscl
        run: |
          sudo apt-get update -qq
          apt-cache policy r-base-core r-cran-pscl | sed -n '1,40p'
          sudo apt-get install -y -qq r-base-core r-base-dev r-cran-mass || true
          if ! Rscript -e 'library(pscl)' 2>/dev/null; then
            sudo apt-get install -y -qq r-cran-pscl || Rscript -e 'install.packages("pscl", repos="https://cloud.r-project.org")'
          fi
          Rscript -e 'cat(R.version.string, "\n"); library(pscl); cat(as.character(packageVersion("pscl")), "\n")'
      - name: Measure pscl parameterisation
        run: |
          cat > /tmp/probe.R <<'RSCRIPT'
          set.seed(11)
          n <- 40
          g <- factor(rep(c("A","B"), each = n/2))
          s <- exp(rnorm(n, 0, 0.4))
          logitp <- 0.4 + 0.5 * (g == "B") + 0.8 * log(s)
          p <- plogis(logitp)
          mu <- exp(1.2 + 0.9 * (g == "B")) * s
          theta <- 2.5
          z <- rbinom(n, 1, p)
          y <- ifelse(z == 1, rnbinom(n, mu = mu, size = theta), 0)
          d <- data.frame(y = y, g = g, s = s)

          fit <- pscl::hurdle(y ~ g + offset(log(s)) | g + log(s), data = d,
                              dist = "negbin", zero.dist = "binomial")
          cat("== hurdle ==\n")
          print(coef(fit, model = "count"))
          print(coef(fit, model = "zero"))
          cat("theta:", fit$theta, "\n")
          cat("logLik:", as.numeric(logLik(fit)), "\n")
          cat("df:", attr(logLik(fit), "df"), "\n")
          eta0 <- model.matrix(~ g + log(s), data = d) %*% coef(fit, model = "zero")
          cat("cor(plogis(eta0), y==0):", cor(plogis(eta0), as.numeric(d$y == 0)), "\n")
          cat("cor(plogis(eta0), y>0):", cor(plogis(eta0), as.numeric(d$y > 0)), "\n")
          cat("mean(y==0):", mean(d$y == 0), " mean(plogis(eta0)):", mean(plogis(eta0)), "\n")

          fit0 <- pscl::hurdle(y ~ offset(log(s)) | log(s), data = d,
                               dist = "negbin", zero.dist = "binomial")
          cat("null logLik:", as.numeric(logLik(fit0)), "\n")
          cat("LRT:", 2 * (as.numeric(logLik(fit)) - as.numeric(logLik(fit0))), "\n")

          fitz <- pscl::zeroinfl(y ~ g + offset(log(s)) | g + log(s), data = d,
                                 dist = "negbin")
          cat("== zeroinfl ==\n")
          print(coef(fitz, model = "count"))
          print(coef(fitz, model = "zero"))
          cat("theta:", fitz$theta, "\n")
          cat("logLik:", as.numeric(logLik(fitz)), "\n")
          cat("df:", attr(logLik(fitz), "df"), "\n")
          fitz0 <- pscl::zeroinfl(y ~ offset(log(s)) | log(s), data = d, dist = "negbin")
          cat("null logLik:", as.numeric(logLik(fitz0)), "\n")
          cat("LRT:", 2 * (as.numeric(logLik(fitz)) - as.numeric(logLik(fitz0))), "\n")
          cat("names(summary coefficients):\n")
          print(rownames(summary(fitz)$coefficients$count))
          print(rownames(summary(fitz)$coefficients$zero))
          cat("se-zero:", summary(fitz)$coefficients$zero[, 2], "\n")
          cat("se-count:", summary(fitz)$coefficients$count[, 2], "\n")
          cat("converged:", fitz$converged, "\n")
          RSCRIPT
          Rscript /tmp/probe.R

  julia:
    name: julia probe
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: julia-actions/setup-julia@v3.0.2
        with:
          version: "1"
      - name: Install R for RCall
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq r-base-core r-base-dev r-cran-mass || true
      - name: Julia version + RCall smoke
        run: |
          julia -e 'println(VERSION); println(Sys.KERNEL)'
          julia -e '
            using Pkg
            Pkg.activate(mktempdir())
            Pkg.add("RCall")
            using RCall
            R"cat(R.version.string, \"\\n\")"
            R"library(MASS); cat(\"MASS ok\\n\")"
            println("RCALL-OK")'
      - name: Package test smoke
        run: |
          cat Project.toml
          julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
