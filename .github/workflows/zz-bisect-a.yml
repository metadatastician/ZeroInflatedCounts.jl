# probe bisect — temporary
name: Probe A
on:
  push:
    branches: ["arena/**"]
permissions:
  contents: read
jobs:
  agda:
    name: agda only
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install agda
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq agda agda-stdlib || sudo apt-get install -y -qq agda-bin agda-stdlib
          agda --version

