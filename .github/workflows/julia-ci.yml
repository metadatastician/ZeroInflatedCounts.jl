# SPDX-License-Identifier: MPL-2.0
# ZeroInflatedCounts — Julia CI (julia-library archetype)
#
# Pin posture (estate ruling R2, 2026-09-02; D38/D39 resolution 2026-09-19):
# symbolic refs here, pinned by .github/workflows/actions.lock (same dir).
# Refs resolved 2026-09-19 against the estate estate-pins:
#   actions/checkout@v7.0.1        = 3d3c42e5aac5ba805825da76410c181273ba90b1
#   julia-actions/setup-julia@v3.0.2 = fa02766e078afaaf09b14210362cee14137e6a32
#   julia-actions/cache@v3         = e32267b41e0fa7df82a3d53e8c7273620d52c586 (Dependabot bump, locked 2026-10-06)
# Regenerate the lock in the SAME PR as any uses: change (estate MUST).

name: Julia CI

on:
  push:
    branches: [main, master]
  pull_request:

# No `continue-on-error` on a MUST check (R1–R9): a red job is the gate
# working. Coverage (R4) is reported by the estate's standard coverage
# upload where present; it is not a blocker at template level.
permissions:
  contents: read

jobs:
  fmt:
    name: Format (JuliaFormatter)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: julia-actions/setup-julia@v3.0.2
        with:
          version: "1"
      - name: Check formatting (check mode — never writes in CI)
        # Every *.jl under src/ and test/, at any depth. The previous walker
        # called `filter(isfile, ::Iterators.Flatten)`, which has no method, so
        # the job died with a MethodError before checking one file; it also
        # read only one directory level, so src/core/, test/oracle/ and
        # test/helpers/ would never have been checked had it run. Behind that
        # was a second latent defect: `JuliaFormatter.format_string` does not
        # exist in JuliaFormatter 2.x; `format_text` is the string API.
        #
        # As in the JET job, the formatter goes into a throwaway environment
        # with a pinned major version: it no longer mutates this package's
        # Project.toml (which would also resolve and build RCall on a runner
        # with no R), and a new formatter major cannot arrive unannounced.
        run: |
          julia -e '
            using Pkg
            Pkg.activate(mktempdir())
            Pkg.add(Pkg.PackageSpec(name="JuliaFormatter", version="2"))
            using JuliaFormatter
            files = String[]
            for root in ("src", "test"), (dir, _, names) in walkdir(root)
                append!(files, joinpath(dir, n) for n in names if endswith(n, ".jl"))
            end
            isempty(files) && error("format check found no .jl files under src/ or test/")
            bad = String[]
            for f in sort(files)
                text = read(f, String)
                if text != JuliaFormatter.format_text(text)
                    @error "not formatted" file=f
                    push!(bad, f)
                end
            end
            println(length(files), " files checked, ", length(bad), " not formatted")
            isempty(bad) || exit(1)'

  jet:
    name: Static analysis (JET)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: julia-actions/setup-julia@v3.0.2
        with:
          version: "1"
      - uses: julia-actions/cache@v3
      # RCall is a hard dependency (Project.toml [deps]): the production fits
      # are R pscl fits, so the package cannot load on a runner without R.
      # ubuntu-24.04 ships no R, which is why every job that loads the
      # package died in RCall's __init__/precompile before any test or
      # analysis ran. install.packages() only WARNS on failure, so the last
      # line loads pscl to make a failed install fail this step.
      - name: Install R and pscl
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq r-base-core r-base-dev
          sudo Rscript -e 'install.packages("pscl", repos = "https://cloud.r-project.org", lib = "/usr/local/lib/R/site-library")'
          Rscript -e 'library(pscl); cat(R.version.string, "| pscl", as.character(packageVersion("pscl")), "\n")'
          echo "R_HOME=$(R RHOME)" >> "$GITHUB_ENV"
      - name: JET analysis (supported API)
        # JET's path/string entry points were REMOVED in v0.12.0, having been
        # deprecated since v0.11: `report_package(::AbstractString)`,
        # `report_package()` and the corresponding `test_package` forms. The
        # package must be loaded and its MODULE passed instead —
        # `report_package(PkgModule)`. `target_defined_modules` was removed in
        # the same release (use `target_modules`).
        #
        # The previous invocation was `JET.test_package(path=".",
        # julia_version="1")`, which is the removed string form. It failed with
        # `MethodError: no method matching report_package(; toplevel_logger,
        # path, julia_version)` on JET v0.12.2 before any analysis ran. Because
        # the analyzer was installed with an unconstrained `Pkg.add`, the
        # breakage arrived with an upstream release, not with a template change.
        #
        # The analyzer now goes into a throwaway environment with a pinned
        # version, so it no longer mutates this package's Project.toml on every
        # run, and it cannot float to a new major/minor unannounced.
        run: |
          julia -e '
            using Pkg
            Pkg.activate(mktempdir())
            Pkg.develop(path=".")
            # Rebuild RCall against the R installed above: a cached depot may
            # hold a build from a run that had no R.
            Pkg.build("RCall")
            Pkg.add(Pkg.PackageSpec(name="JET", version="0.12"))
            using ZeroInflatedCounts, JET

            # Fail with the actual reason rather than a MethodError if the
            # upstream API moves again. This is the tripwire for the class of
            # defect this job previously shipped: a call that never ran.
            if !hasmethod(JET.test_package, (Module,))
                error("JET ", pkgversion(JET), " has no test_package(::Module) — " *
                      "the julia-library overlay pins an API that no longer exists.")
            end

            JET.test_package(ZeroInflatedCounts)'

  test:
    name: Test (Test + Aqua)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The [compat] floor IS tested — an untested floor is an unproven
        # floor (measured estate gap: Axiology-class repos declare julia 1.9
        # but test 1.10/1.11 only).
        julia: ["1.9", "1"]
        os: [ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: julia-actions/setup-julia@v3.0.2
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v3
      # RCall is a hard dependency (Project.toml [deps]): the production fits
      # are R pscl fits, so the package cannot load on a runner without R.
      # ubuntu-24.04 ships no R, which is why every job that loads the
      # package died in RCall's __init__/precompile before any test or
      # analysis ran. install.packages() only WARNS on failure, so the last
      # line loads pscl to make a failed install fail this step.
      - name: Install R and pscl
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq r-base-core r-base-dev
          sudo Rscript -e 'install.packages("pscl", repos = "https://cloud.r-project.org", lib = "/usr/local/lib/R/site-library")'
          Rscript -e 'library(pscl); cat(R.version.string, "| pscl", as.character(packageVersion("pscl")), "\n")'
          echo "R_HOME=$(R RHOME)" >> "$GITHUB_ENV"
      - name: Pkg.test()
        # Rebuild RCall against the R installed above: a cached depot may hold
        # a build from a run that had no R. Manifest.toml is not committed, so
        # instantiate first: Pkg.build("RCall") on a fresh checkout otherwise
        # fails with "RCall (not found in project or manifest)".
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.build("RCall"); Pkg.test()'
