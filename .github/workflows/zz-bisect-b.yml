# probe bisect — temporary
name: Probe B
on:
  push:
    branches: ["arena/**"]
permissions:
  contents: read
jobs:
  r:
    name: r only
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install R
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq r-base-core r-base-dev r-cran-mass || true
          Rscript -e 'cat(R.version.string, "\n")'

